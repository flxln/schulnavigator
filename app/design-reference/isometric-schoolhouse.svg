      <line x1="330" y1="109" x2="330" y2="127" stroke="#082a50" stroke-width="1"/>
      <line x1="321" y1="118" x2="339" y2="118" stroke="#082a50" stroke-width="1"/>
    </g>
    <rect id="front-wall" x="180" y="140" width="310" height="275" fill="url(#sh-wall)" stroke="rgba(8,42,80,.18)" stroke-width="1"/>
    <rect x="176" y="225" width="318" height="4" fill="rgba(8,42,80,.12)"/>
    <rect x="176" y="307" width="318" height="4" fill="rgba(8,42,80,.12)"/>
    <rect x="176" y="395" width="318" height="20" fill="#B9AC8C"/>
    <g id="flag">
      <rect x="428" y="72" width="10" height="26" fill="#0B3565"/>
      <polygon points="424,72 442,72 433,55" fill="#ef3a37"/>
      <circle cx="433" cy="50" r="3.5" fill="#fbbb24"/>
    </g>
    <g id="jubilee-badge" transform="translate(255, 350)">
      <rect x="0" y="0" width="42" height="22" rx="2" fill="#082a50"/>
      <text x="21" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#ffffff" letter-spacing="0.5">150</text>
      <text x="21" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="6.5" fill="#fbbb24" letter-spacing="1">JAHRE</text>
    </g>
    <g id="decor-trees">
      <ellipse cx="170" cy="420" rx="28" ry="14" fill="#4B9A23" opacity="0.85"/>
      <ellipse cx="170" cy="415" rx="22" ry="12" fill="#6BB246"/>
      <ellipse cx="500" cy="425" rx="22" ry="12" fill="#4B9A23" opacity="0.85"/>
      <ellipse cx="500" cy="420" rx="17" ry="10" fill="#6BB246"/>
    </g>
    <g id="decor-bench">
      <rect x="340" y="425" width="40" height="3" fill="#8b6a3a"/>
      <rect x="343" y="428" width="3" height="7" fill="#8b6a3a"/>
      <rect x="374" y="428" width="3" height="7" fill="#8b6a3a"/>
    </g>
  </g>

  <g id="windows">
