<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const panorama = document.getElementById('panorama-frame');
            const marker = document.getElementById('active-marker');
            
            // Subtle parallax effect on move
            panorama.addEventListener('mousemove', (e) => {
                if (window.innerWidth < 1024) return;
                const { clientX, clientY } = e;
                const { innerWidth, innerHeight } = window;
                const xPos = (clientX / innerWidth - 0.5) * 10;
                const yPos = (clientY / innerHeight - 0.5) * 10;
                
                const img = panorama.querySelector('div');
                img.style.transform = `scale(1.05) translate(${xPos}px, ${yPos}px)`;
            });

            panorama.addEventListener('mouseleave', () => {
                const img = panorama.querySelector('div');
                img.style.transform = `scale(1) translate(0, 0)`;
            });

            // Logic to move marker on click
            panorama.addEventListener('click', (e) => {
                const rect = panorama.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;

                marker.style.left = `${x}%`;
                marker.style.top = `${y}%`;

                // Update UI coordinates
                const coordDisplays = document.querySelectorAll('.font-code.text-body-md.font-bold');
                coordDisplays[0].innerText = `${Math.round(x)} %`;
                coordDisplays[1].innerText = `${Math.round(y)} %`;
            });
        });
    </script>
