<!DOCTYPE html>

<html class="light" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MPZ Studio - Unlock</title>

          extend: {

                    "on-primary-fixed-variant": "#1d5200",
                    "surface-variant": "#e3e2df",
                    "secondary-fixed": "#d5e3ff",

                    "on-surface": "#1b1c1a",
                    "surface-container-low": "#f4f4f0",
                    "surface-container": "#efeeea",
                    "inverse-surface": "#2f312e",
                    "outline": "#717a68",
                    "primary-fixed-dim": "#87db5d",
                    "on-secondary-fixed-variant": "#004786",
                    "on-secondary-fixed": "#001c3b",
                    "on-error": "#ffffff",
                    "secondary": "#045faf",
                    "surface-bright": "#faf9f5",
                    "tertiary-container": "#5b76a0",
                    "surface-container-highest": "#e3e2df",
                    "tertiary-fixed": "#d5e3ff",
                    "tertiary-fixed-dim": "#acc8f6",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#37850a",
                    "on-tertiary-fixed": "#001c3b",
                    "on-primary-container": "#f8ffee",
                    "on-primary-fixed": "#072100",
                    "on-tertiary-container": "#fefcff",
                    "on-error-container": "#93000a",
                    "surface": "#faf9f5",
                    "secondary-fixed-dim": "#a6c8ff",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#003e76",

                    "inverse-primary": "#87db5d",
                    "primary-fixed": "#a2f876",
                    "on-background": "#1b1c1a",
                    "primary": "#276a00",
                    "surface-container-high": "#e9e8e4",
                    "on-tertiary-fixed-variant": "#2c476f",
                    "error": "#ba1a1a",
                    "secondary-container": "#6daaff",
                    "inverse-on-surface": "#f2f1ed",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-tint": "#286c00",

            "borderRadius": {

            "spacing": {

                    "gutter": "16px",

<style>
        body {
            background-color: #fcfbf7; /* Specified Paper Background */
            font-family: 'Nunito Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(8,42,80,0.05), 0 2px 4px -1px rgba(8,42,80,0.03);
            border: 1px solid rgba(8,42,80,0.1);
        }
        .focus-ring:focus {
            outline: none;
            border-color: #045faf; /* Brand Blue */
            box-shadow: 0 0 0 2px rgba(4, 95, 175, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-container-padding">
<!-- Screen Content Container -->
<main class="w-full max-w-[400px] animate-in fade-in duration-700 slide-in-from-bottom-4">
<!-- Minimal Login Card -->
<div class="login-card bg-surface-container-lowest rounded-xl p-stack-lg flex flex-col items-center">
<!-- Brand Logo Header -->
<div class="mb-stack-lg text-center">
<h1 class="font-h1 text-h1 text-primary tracking-tight">MPZ Studio</h1>
<p class="font-caption text-caption text-on-surface-variant mt-1 opacity-70">Admin Console Access</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-stack-md" id="unlock-form" onsubmit="handleUnlock(event)">
<div class="space-y-stack-sm">
<label class="font-sidebar-header text-sidebar-header text-on-surface-variant uppercase block" for="password">
                        Passwort
                    </label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface focus-ring transition-all placeholder:opacity-30" id="password" placeholder="••••••••" required="" type="password"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 pointer-events-none">
                            lock
                        </span>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-h2 text-h2 py-3 rounded-full hover:bg-primary transition-colors duration-200 flex items-center justify-center gap-2 group" type="submit">
<span>Freischalten</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">
                        arrow_forward
                    </span>
</button>
</form>
<!-- Footer / Status Note -->
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant/30 w-full flex flex-col items-center gap-stack-sm">
<div class="flex items-center gap-2 px-3 py-1 bg-surface-container rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-widest font-bold">Nur development</span>
</div>
<p class="font-caption text-caption text-on-surface-variant opacity-50 text-center">
                    Authorized access only. Session activity is monitored.
                </p>
</div>
</div>
<!-- Utility Links -->
<div class="mt-stack-md text-center">
<a class="font-caption text-caption text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant/50 underline-offset-4" href="#">
                Support anfordern
            </a>
</div>
</main>
<!-- Success Feedback Overlay (Hidden by default) -->
<div class="fixed inset-0 bg-surface/80 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300" id="success-overlay">
<div class="bg-surface-container-lowest login-card p-stack-lg rounded-xl flex flex-col items-center max-w-[320px] text-center">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-h2 text-h2 text-primary mb-1">Zugriff gewährt</h2>
<p class="font-body-md text-on-surface-variant">Lade MPZ Studio Konsole...</p>
</div>
</div>
<script>
        function handleUnlock(event) {
            event.preventDefault();
            const button = event.target.querySelector('button');
            const originalContent = button.innerHTML;
            
            // Interaction Feedback
            button.disabled = true;
            button.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
            
            setTimeout(() => {
                const overlay = document.getElementById('success-overlay');
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlay.classList.add('opacity-100');
                
                // Simulate redirect
                setTimeout(() => {
                    console.log("Redirecting to dashboard...");
                    // In a real app: window.location.href = '/mpz/dashboard';
                }, 1500);
            }, 800);
        }

        // Keyboard accessibility
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && (e.metaKey || e.ctrlKey)) {
                console.log("Dev shortcut triggered: Manual override");
            }
        });
    </script>
</body></html>
