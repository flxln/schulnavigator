b-4"><span class="text-caption font-bold text-brand-navy/40">#03</span><div class="w-2 h-2 rounded-full bg-brand-green"></div></div><h3 class="text-h2 font-h2 text-brand-navy mb-2">Lehrerzimmer</h3><div class="flex gap-2"><span class="px-2 py-0.5 bg-surface-container-highest text-[10px] font-bold rounded uppercase">360°</span><span class="px-2 py-0.5 bg-brand-green/10 text-brand-green text-[10px] font-bold rounded uppercase">Aktiv</span></div></div></div></section>

<span class="material-symbols-outlined text-brand-green">cloud_done</span>

<script>
        // Micro-interaction for the primary CTA
        const cta = document.querySelector('button.bg-brand-green');
        const toast = document.getElementById('save-toast');

        cta.addEventListener('click', () => {
            // Simulate save effect
            cta.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> Speichern...';
            cta.disabled = true;
            
            setTimeout(() => {
                cta.innerHTML = 'Speichern & Validieren';
                cta.disabled = false;
                
                // Show toast
                toast.classList.remove('translate-y-20', 'opacity-0');
                
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }, 1500);
        });

        // Hover effect for table rows
        document.querySelectorAll('tr').forEach(row => {
            row.addEventListener('mouseenter', () => {
                row.style.transform = 'translateX(4px)';
                row.style.transition = 'transform 0.2s ease';
            });
            row.addEventListener('mouseleave', () => {
                row.style.transform = 'translateX(0px)';
            });
        });
    </script>
